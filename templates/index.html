<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phishing URL Detector</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(15, 23, 42, 0.92);
      --panel-2: #0f1c34;
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --text: #e5eefb;
      --muted: #94a3b8;
      --danger: #fb7185;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 22%),
        radial-gradient(circle at top right, rgba(34, 197, 94, 0.16), transparent 24%),
        linear-gradient(135deg, #020617, #0b1220 55%, #081423);
      color: var(--text);
      min-height: 100vh;
      padding: 32px;
    }
    .dashboard {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(8, 15, 34, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .header {
      padding: 26px 30px;
      background: linear-gradient(90deg, rgba(34,197,94,0.13), rgba(56,189,248,0.12));
      border-bottom: 1px solid rgba(148,163,184,0.14);
    }
    .header h1 { margin: 0 0 6px; font-size: 2rem; }
    .header p { margin: 0; color: var(--muted); }
    .content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 22px;
      padding: 24px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 20px;
      padding: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: #0a1630;
      color: var(--text);
      outline: none;
      font-size: 1rem;
    }
    button {
      margin-top: 14px;
      width: 100%;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 700;
      color: #03121c;
      background: linear-gradient(90deg, var(--accent), #7dd3fc);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }
    button:disabled {
      cursor: wait;
      opacity: 0.82;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .badge.safe { background: rgba(34,197,94,0.16); color: #86efac; }
    .badge.phishing { background: rgba(251,113,133,0.16); color: #fda4af; }
    .score {
      font-size: 2.4rem;
      font-weight: 800;
      margin: 10px 0 4px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .metric {
      background: var(--panel-2);
      border-radius: 14px;
      padding: 14px;
    }
    .metric small { color: var(--muted); display: block; margin-bottom: 6px; }
    .metric strong { font-size: 1.1rem; }
    .placeholder { color: var(--muted); }
    @media (max-width: 800px) {
      .content { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>URL Threat Intelligence Console</h1>
      <p>Real-world phishing detection with a modern response dashboard.</p>
    </div>
    <div class="content">
      <div class="panel">
        <label for="urlInput">Paste or type a URL</label>
        <input id="urlInput" type="text" placeholder="https://example.com/login" />
        <button id="analyzeBtn" onclick="predict()">Analyze URL</button>
      </div>

      <div class="panel" id="resultBox">
        <div class="placeholder">Analysis results will appear here.</div>
      </div>
    </div>
  </div>

  <script>
    async function predict() {
      const url = document.getElementById('urlInput').value.trim();
      const resultBox = document.getElementById('resultBox');
      const analyzeBtn = document.getElementById('analyzeBtn');

      if (!url) {
        resultBox.innerHTML = '<div class="placeholder">Please enter a URL before analyzing.</div>';
        return;
      }

      analyzeBtn.disabled = true;
      analyzeBtn.textContent = 'Analyzing...';
      resultBox.innerHTML = '<div class="placeholder">Analyzing URL... Please wait.</div>';

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        if (!response.ok) {
          throw new Error('Server returned an error response.');
        }

        const data = await response.json();

        const labelClass = data.label === 'phishing' ? 'phishing' : 'safe';
        const scoreColor = data.label === 'phishing' ? '#fda4af' : '#86efac';

        resultBox.innerHTML = `
          <div class="badge ${labelClass}">${data.label.toUpperCase()}</div>
          <div class="score" style="color:${scoreColor}">${data.score}%</div>
          <div><strong>Target URL:</strong> ${data.url}</div>
          <div class="metrics">
            <div class="metric"><small>Hostname</small><strong>${data.features.hostname}</strong></div>
            <div class="metric"><small>TLD</small><strong>${data.features.tld || 'N/A'}</strong></div>
            <div class="metric"><small>Query Length</small><strong>${data.features.query_length}</strong></div>
            <div class="metric"><small>Path Length</small><strong>${data.features.path_length}</strong></div>
            <div class="metric"><small>Subdomains</small><strong>${data.features.subdomain_count}</strong></div>
            <div class="metric"><small>Keywords</small><strong>${data.features.suspicious_keyword_list.join(', ') || 'None'}</strong></div>
          </div>
        `;
      } catch (error) {
        resultBox.innerHTML = '<div class="placeholder">Unable to analyze the URL right now. Please try again.</div>';
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = 'Analyze URL';
      }
    }
  </script>
</body>
</html>
